# 결제 부하·복구 시험(#133) 전용 overlay. 기존 개발 볼륨을 건드리지 않도록 별도 프로젝트 이름으로 띄운다.
#   docker compose -p commerce-settle-load -f compose.yml -f tests/load/compose.load.yml up -d --build
# 수신 그룹 offset을 준비하기 전에는 이 overlay의 Listener를 켜지 않는다. 순서는 tests/load/README.md를 따른다.
services:
  payment-api:
    environment:
      # 운영 재처리 시험용 운영자 자격. payment_load.py가 tests/load/work/operator.credential에 무작위로 만든다.
      SPRING_APPLICATION_JSON: '{"app":{"internal-auth":{"senders":{"[operator:load]":{"current":"${LOAD_OPERATOR_CREDENTIAL:?Run tests/load/payment_load.py}"}}}}}'
  payment-worker:
    environment:
      APP_KAFKA_ORDERPAYMENTREQUESTED_ENABLED: ${LOAD_PAYMENT_LISTENER_ENABLED:-false}
      APP_PAYMENTREQUESTPROCESSOR_ENABLED: 'true'
      APP_PAYMENTAPPROVAL_ENABLED: 'true'
      PAYMENT_APPROVAL_GATEWAY: http
      PAYMENT_SCENARIO_VERSION: ${LOAD_PG_SCENARIO:-load-pg-normal-v1}
      APP_OUTBOX_ENABLED: 'true'
