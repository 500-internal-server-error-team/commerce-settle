dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'org.postgresql:postgresql'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-api:${rootProject.springdocVersion}"
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
}

tasks.register('kafkaCapacityExperiment', JavaExec) {
    description = '격리된 Kafka/PostgreSQL에서 사전 등록한 수신 용량 실험을 실행한다.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.commercesettle.payment.infrastructure.messaging.KafkaCapacityExperiment'
    workingDir rootProject.projectDir
    maxHeapSize = '512m'
    args rootProject.file('tests/load/kafka-capacity-plan.json').absolutePath,
         providers.gradleProperty('capacityOutput').getOrElse(rootProject.file('tests/load/kafka-capacity-results.json').absolutePath),
         providers.gradleProperty('capacityMode').getOrElse('capacity'),
         providers.gradleProperty('capacityCalibration').getOrElse('')
}
