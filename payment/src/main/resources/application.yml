server:
  port: ${SERVER_PORT:8080}

spring:
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-context-time-zone: true
  application:
    name: payment
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: payment
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      observation-enabled: true
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: payment.v1
      enable-auto-commit: false
      auto-offset-reset: none
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      observation-enabled: true
      ack-mode: manual_immediate
      concurrency: 1
      missing-topics-fatal: true

springdoc:
  paths-to-match: /api/**

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${PAYMENT_ROLE:app}

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"

app:
  internal-auth:
    service: payment
    # Gateway의 내부 호출 자격(ADR 0010). 없거나 43자 미만이면 기동하지 않는다. previous는 교체 중에만 둔다.
    senders:
      gateway:
        current: ${PAYMENT_GATEWAY_CREDENTIAL}
        previous: ${PAYMENT_GATEWAY_CREDENTIAL_PREVIOUS:}
  dev-fixtures:
    enabled: ${APP_DEV_FIXTURES_ENABLED:false}
    run-scenarios: ${APP_DEV_FIXTURE_SCENARIOS_ENABLED:false}
  kafka:
    quarantine:
      # 새 초기 SQL과 격리·DLT·재처리 시험을 확인한 환경에서만 켠다.
      enabled: false
      interval-ms: 1000
      batch-size: 32
      lease-ms: 240000
      result-timeout-ms: 125000
    order-payment-requested:
      # 개발용 초기 SQL 적용과 신규 그룹 offset 초기화 후에만 활성화한다.
      enabled: false
  payment-request-processor:
    # PAYMENT_ROLE=worker에서만 동작한다. WAITING 결제 요청을 결제·승인 작업으로 처리한다.
    # 실패는 최대 10회까지 1~60초 간격으로 재시도한 뒤 REVIEW_REQUIRED로 남긴다.
    enabled: false
    interval-ms: 1000
    batch-size: 100
    # 선점 뒤 처리 결과나 실패를 기록하기 전까지 다른 처리기가 같은 요청을 다시 잡지 않는 시간.
    # 한 건의 처리 트랜잭션보다 충분히 길어야 한다.
    lease-ms: 30000
  payment-approval:
    # PAYMENT_ROLE=worker에서만 동작한다. 외부 결제액이 있는 결제의 승인 작업을 PG 대역에 보내고 결과를 반영한다.
    enabled: false
    # stub: 즉시 승인하는 개발용 대역(finance-mock PG 대역 #121 병합 전), http: finance-mock PG 대역
    gateway: ${PAYMENT_APPROVAL_GATEWAY:stub}
    mock-base-url: ${FINANCE_MOCK_URL:http://finance-mock:8080}
    poll-interval-ms: 1000
    max-jobs-per-poll: 20
    # 호출 제한 시간은 임대보다 짧아야 한다.
    lease-duration: 30s
    http-timeout: 5s
    unconfirmed-retry-delay: 5s
    max-attempts: 10
    card-provider: PG_A
    funding-account-ref: ${PAYMENT_FUNDING_ACCOUNT_REF:payout-funding-default}
    scenario-version: ${PAYMENT_SCENARIO_VERSION:pg-normal-v1}
  outbox:
    # PAYMENT_ROLE=worker에서만 동작한다. 커밋된 결제 이벤트를 Kafka로 발행한다.
    enabled: false
    recovery-interval-ms: 1000
    max-in-flight: 8
    lease-ms: 240000
    max-attempts: 10
