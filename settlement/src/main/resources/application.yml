server:
  port: ${SERVER_PORT:8080}

spring:
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-context-time-zone: true
  application:
    name: settlement
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: settlement
  sql:
    init:
      mode: never
  batch:
    job:
      # 기동 시 자동 실행하지 않고 스케줄러가 batchDate로 실행한다(ADR 0007 D7).
      enabled: false
    jdbc:
      # 메타데이터 테이블은 settlement 초기 SQL이 만든다.
      initialize-schema: never
      table-prefix: settlement.BATCH_
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      observation-enabled: true
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: settlement.v1
      enable-auto-commit: false
      auto-offset-reset: none
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      observation-enabled: true
      ack-mode: manual_immediate
      concurrency: 1
      missing-topics-fatal: true

settlement:
  daily-batch:
    policy-version: delivery-daily-v1
    schedule-enabled: ${SETTLEMENT_DAILY_BATCH_ENABLED:true}
  payout:
    # finance-mock 지급 대역의 재원 계정·금융 실행 시나리오. 지급 생성 때 지급에 고정한다.
    funding-account-ref: ${PAYOUT_FUNDING_ACCOUNT_REF:payout-funding-default}
    scenario-version: ${PAYOUT_SCENARIO_VERSION:payout-normal-v1}
    # 원거래 조회에 쓰는 조회 통신 시나리오. 원거래의 금융 실행 버전과 별개다.
    lookup-scenario-version: ${PAYOUT_LOOKUP_SCENARIO_VERSION:payout-normal-v1}
    mock-base-url: ${FINANCE_MOCK_URL:http://finance-mock:8080}
  payout-worker:
    enabled: ${SETTLEMENT_PAYOUT_WORKER_ENABLED:true}
    # 금융 Worker 임대 기준: 조회 1초, 임대 30초, HTTP 5초(policies.md). 미확정은 5분마다 원거래를 조회한다.
    poll-interval-ms: 1000
    lease-duration: 30s
    http-timeout: 5s
    unconfirmed-retry-delay: 5m
    max-attempts: 10
    max-jobs-per-poll: 8

springdoc:
  paths-to-match: /api/**

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${PAYMENT_ROLE:app}

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"
