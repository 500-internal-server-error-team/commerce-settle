# 새 전용 UI 실험 스택에만 적용한다. 기존 사용자 확인용 프로젝트에는 적용하지 않는다.
services:
  commerce:
    ports:
      - 127.0.0.1:18081:8080
    environment:
      SPRING_APPLICATION_JSON: '{"app":{"internal-auth":{"senders":{"[operator:demo-ui]":{"current":"${DEMO_COMMERCE_OPERATOR_CREDENTIAL:?Set demo operator credential}"}}}}}'
  payment-api:
    ports:
      - 127.0.0.1:18082:8080
    environment:
      SPRING_APPLICATION_JSON: '{"app":{"internal-auth":{"senders":{"[operator:demo-ui]":{"current":"${DEMO_PAYMENT_OPERATOR_CREDENTIAL:?Set demo operator credential}"}}}}}'
  settlement:
    ports:
      - 127.0.0.1:18083:8080
    environment:
      SPRING_APPLICATION_JSON: '{"app":{"internal-auth":{"senders":{"[operator:demo-ui]":{"current":"${DEMO_SETTLEMENT_OPERATOR_CREDENTIAL:?Set demo operator credential}"}}}}}'
  finance-mock:
    ports:
      - 127.0.0.1:18084:8080
    environment:
      SPRING_APPLICATION_JSON: '{"app":{"internal-auth":{"senders":{"[operator:demo-ui]":{"current":"${DEMO_FINANCE_MOCK_OPERATOR_CREDENTIAL:?Set demo operator credential}"}}}}}'
