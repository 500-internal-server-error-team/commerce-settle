route:
  receiver: local-ui
  group_by: [environment, application, consumer, alertname, kind, queue, operation, group, store]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
receivers:
  - name: local-ui
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [environment, application, consumer, alertname, kind, queue, operation, group, store]
