route:
  receiver: slack
  group_by: [environment, application, service, consumer, alertname, kind, queue, operation, group, store]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
receivers:
  - name: slack
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        send_resolved: true
        title: '{{ .Status | toUpper }} / {{ .CommonLabels.alertname }} / {{ .CommonLabels.severity }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.runbook_url }}{{ "\n" }}{{ end }}'
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [environment, application, consumer, alertname, kind, queue, operation, group, store]
  - source_matchers: ['alertname="ContainerMemoryCritical"', 'severity="critical"']
    target_matchers: ['alertname="ContainerMemoryPressure"', 'severity="warning"']
    equal: [environment, job, instance, service, basis]
