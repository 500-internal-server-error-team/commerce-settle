global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
rule_files:
  - /etc/prometheus/quarantine.rules.yml
  - /etc/prometheus/notification.rules.yml
  - /etc/prometheus/financial.rules.yml
  - /etc/prometheus/runtime.rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: commerce-settle
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:9091
          - commerce:9091
          - payment-api:9091
          - payment-worker:9091
          - settlement:9091
          - finance-mock:9091
  - job_name: data-storage
    static_configs:
      - targets: [data-storage-metrics:9108]
  - job_name: container-runtime
    static_configs:
      - targets: [container-metrics:9109]
  - job_name: zipkin
    metrics_path: /prometheus
    static_configs:
      - targets: [zipkin:9411]
