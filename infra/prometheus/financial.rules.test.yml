rule_files: [financial.rules.yml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'commerce_settle_business_cohort_observed_timestamp_seconds{operation="payout.unapplied"}'
        values: '0+15x40'
      - series: 'commerce_settle_business_cohort_capture_complete{operation="payout.unapplied"}'
        values: '0x28 1x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: BusinessCohortPopulationUnverified
        exp_alerts: []
      - eval_time: 6m
        alertname: BusinessCohortPopulationUnverified
        exp_alerts:
          - exp_labels: {severity: warning, operation: payout.unapplied}
            exp_annotations:
              summary: 지급 모집단의 Payment 원천 대조가 완료되지 않았습니다.
              runbook_url: https://github.com/500-internal-server-error-team/commerce-settle/blob/develop/docs/development.md#금융-처리-시간과-비동기-추적
      - eval_time: 8m
        alertname: BusinessCohortPopulationUnverified
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'commerce_settle_business_observed_timestamp_seconds{operation="payment.confirmed",window="900",job="apps",instance="one"}'
        values: '0+15x16'
      - series: 'commerce_settle_business_observed_timestamp_seconds{operation="refund.completed",window="900",job="apps",instance="one"}'
        values: '0+15x16'
