dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${rootProject.springdocVersion}"
}

tasks.named('processResources') {
    from(rootProject.file('docs/openapi.json')) { into 'contracts' }
}
