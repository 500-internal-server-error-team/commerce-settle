dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${rootProject.springdocVersion}"
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('processResources') {
    from(rootProject.file('docs/openapi.json')) { into 'contracts' }
}

tasks.named('processTestResources') {
    ['gateway', 'commerce', 'payment', 'settlement', 'finance-mock'].each { service ->
        from(rootProject.file("${service}/src/main/resources/application.yml")) {
            into "time-contract/${service}"
        }
    }
}
