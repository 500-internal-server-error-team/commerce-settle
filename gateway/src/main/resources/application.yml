server:
  port: ${SERVER_PORT:8080}

spring:
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-context-time-zone: true
  application:
    name: gateway
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: commerce-docs
              uri: ${gateway.services.commerce}
              predicates:
                - Path=/v3/api-docs/commerce
              filters:
                - SetPath=/v3/api-docs
            - id: payment-docs
              uri: ${gateway.services.payment}
              predicates:
                - Path=/v3/api-docs/payment
              filters:
                - SetPath=/v3/api-docs
            - id: settlement-docs
              uri: ${gateway.services.settlement}
              predicates:
                - Path=/v3/api-docs/settlement
              filters:
                - SetPath=/v3/api-docs

gateway:
  services:
    commerce: ${COMMERCE_URL:http://commerce:8080}
    payment: ${PAYMENT_URL:http://payment-api:8080}
    settlement: ${SETTLEMENT_URL:http://settlement:8080}
  auth:
    # 세션 키의 인증 세대. 커머스와 같은 UUID를 쓰며 없으면 기동하지 않는다.
    session-epoch: ${AUTH_SESSION_EPOCH}

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: Commerce
        url: /v3/api-docs/commerce
      - name: Payment
        url: /v3/api-docs/payment
      - name: Settlement
        url: /v3/api-docs/settlement

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      role: gateway

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"
