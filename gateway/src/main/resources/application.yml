server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: seller-api
              uri: ${SELLER_URL:http://seller:8080}
              predicates:
                - Path=/api/sellers,/api/sellers/**
            - id: payment-api
              uri: ${PAYMENT_URL:http://payment-api:8080}
              predicates:
                - Path=/api/payments,/api/payments/**,/api/refunds,/api/refunds/**
            - id: settlement-api
              uri: ${SETTLEMENT_URL:http://settlement:8080}
              predicates:
                - Path=/api/settlements,/api/settlements/**
            - id: seller-docs
              uri: ${SELLER_URL:http://seller:8080}
              predicates:
                - Path=/v3/api-docs/seller
              filters:
                - SetPath=/v3/api-docs
            - id: payment-docs
              uri: ${PAYMENT_URL:http://payment-api:8080}
              predicates:
                - Path=/v3/api-docs/payment
              filters:
                - SetPath=/v3/api-docs
            - id: settlement-docs
              uri: ${SETTLEMENT_URL:http://settlement:8080}
              predicates:
                - Path=/v3/api-docs/settlement
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: Seller
        url: /v3/api-docs/seller
      - name: Payment
        url: /v3/api-docs/payment
      - name: Settlement
        url: /v3/api-docs/settlement

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      role: gateway
