plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '8.10.4' apply false
}

ext.springdocVersion = '2.8.17'

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'checkstyle'

    group = 'com.commercesettle'
    version = '0.0.1-SNAPSHOT'

    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    repositories { mavenCentral() }

    dependencyManagement {
        imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3' }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'io.micrometer:micrometer-tracing-bridge-otel'
        runtimeOnly 'io.opentelemetry:opentelemetry-exporter-zipkin'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            googleJavaFormat('1.36.1')
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
    checkstyle {
        toolVersion = '14.3.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }
    tasks.withType(Checkstyle).configureEach {
        reports { xml.required = true; html.required = true }
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.named('test') {
        useJUnitPlatform()
        testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
    }
    tasks.named('bootJar') { archiveFileName = 'app.jar' }
    tasks.named('jar') { enabled = false }
}
