import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '8.10.4' apply false
}

ext.springdocVersion = '2.8.17'

// 실행 앱이 아닌 공유 라이브러리. Boot 실행 jar 대신 일반 jar를 만든다.
def libraries = ['internal-auth', 'observability']

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'checkstyle'

    // CVE-2025-48924 수정본이자 Swagger가 요청하는 버전.
    ext['commons-lang3.version'] = '3.20.0'

    group = 'com.commercesettle'
    version = '0.0.1-SNAPSHOT'

    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    repositories { mavenCentral() }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3'
        }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            googleJavaFormat('1.36.1')
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
    checkstyle {
        toolVersion = '14.3.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }
    tasks.withType(Checkstyle).configureEach {
        reports { xml.required = true; html.required = true }
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.named('test') {
        useJUnitPlatform()
        testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
    }
}

configure(subprojects.findAll { it.name in libraries }) {
    apply plugin: 'java-library'
}

configure(subprojects.findAll { !(it.name in libraries) }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'io.micrometer:micrometer-tracing-bridge-otel'
        runtimeOnly 'io.opentelemetry:opentelemetry-exporter-zipkin'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    }

    tasks.named('processTestResources') {
        from(rootProject.file('infra/postgres/schema')) {
            include "${project.name.replace('-', '_')}.sql"
            into 'db'
        }
    }
    tasks.named('bootRun') { jvmArgs '-Duser.timezone=Asia/Seoul' }
    tasks.named('bootJar') { archiveFileName = 'app.jar' }
    tasks.named('jar') { enabled = false }
}
