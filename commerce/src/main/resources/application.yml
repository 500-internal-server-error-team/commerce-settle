server:
  port: ${SERVER_PORT:8080}

spring:
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-context-time-zone: true
  application:
    name: commerce
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: commerce
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    template:
      observation-enabled: true
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: commerce.v1
      enable-auto-commit: false
      auto-offset-reset: none
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      observation-enabled: true
      ack-mode: manual_immediate
      concurrency: 1
      missing-topics-fatal: true
  # 오류 응답의 검증 사유를 다른 응답 문구와 같은 한국어로 고정한다.
  web:
    locale: ko_KR
    locale-resolver: fixed

springdoc:
  paths-to-match: /api/**

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${PAYMENT_ROLE:app}

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"

app:
  order-admission:
    prometheus-url: ${APP_ORDER_ADMISSION_PROMETHEUS_URL:http://prometheus:9090}
    paused: ${APP_ORDER_ADMISSION_PAUSED:false}
  kafka:
    payment-accepted:
      enabled: false
  order-workflow:
    enabled: ${APP_ORDER_WORKFLOW_ENABLED:false}
    interval-ms: 60000
  order-result-processor:
    enabled: ${APP_ORDER_RESULT_PROCESSOR_ENABLED:false}
    interval-ms: 1000
  payment-accepted-processor:
    enabled: false
    interval-ms: 1000
    batch-size: 100
  dev-fixtures:
    enabled: ${APP_DEV_FIXTURES_ENABLED:false}
    password: ${DEV_FIXTURE_PASSWORD:}
  order-stub:
    enabled: ${APP_ORDER_STUB_ENABLED:false}
    seed: ${APP_ORDER_STUB_SEED:67}
  sale-events:
    # 이벤트 시작·종료 처리. docs/architecture.md#정기-작업과-비동기-실행
    scheduler-enabled: true
    schedule-interval-ms: 60000
    batch-size: 100
  outbox:
    enabled: false
    recovery-interval-ms: 1000
    max-in-flight: 8
    lease-ms: 240000
    max-attempts: 10
  auth:
    # 세션 키의 인증 세대. Gateway와 같은 UUID를 쓰며 없으면 기동하지 않는다.
    session-epoch: ${AUTH_SESSION_EPOCH}
    # 승인한 Redis 실행 식별자(INFO server의 run_id). Gateway와 같은 값이며 없거나 형식이 틀리면 기동하지 않는다.
    redis-run-id: ${AUTH_REDIS_RUN_ID}
    rate-limit:
      identifier-hmac-key: ${AUTH_RATE_LIMIT_HMAC_KEY}
      # 프로젝트 시작 기본값. docs/policies.md#로그인복구-요청-제한
      login-max-requests: 5
      login-window-seconds: 900
      password-reset-max-requests: 3
      password-reset-window-seconds: 3600
    password-reset:
      delivery-key: ${AUTH_RESET_DELIVERY_KEY}
  address:
    # 주소록 배송 정보 암호문의 서버 키. 없으면 기동하지 않는다.
    encryption-key: ${ADDRESS_ENCRYPTION_KEY}
  internal-auth:
    service: commerce
    # 발신자별 내부 호출 자격(ADR 0010). gateway가 없거나 43자 미만이면 기동하지 않는다. previous는 교체 중에만 둔다.
    senders:
      gateway:
        current: ${COMMERCE_GATEWAY_CREDENTIAL}
        previous: ${COMMERCE_GATEWAY_CREDENTIAL_PREVIOUS:}
