dependencies {
    implementation project(':observability')
    implementation project(':internal-auth')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // Argon2id 비밀번호 해시. spring-security-crypto의 Argon2 구현이 BouncyCastle을 사용한다.
    implementation 'org.springframework.security:spring-security-crypto'
    runtimeOnly 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    runtimeOnly 'org.postgresql:postgresql'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-api:${rootProject.springdocVersion}"
    // 실제 요청·응답과 생성 명세를 정식 OpenAPI 계약에 대조한다.
    implementation 'com.networknt:json-schema-validator:2.0.4'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.projectreactor.netty:reactor-netty-http'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:junit-jupiter'
}

// 내부 호출 자격 판정이 요청을 명세 작업과 대조한다. 테스트도 같은 리소스를 쓴다.
tasks.named('processResources') {
    from(rootProject.file('docs/openapi.json')) { into 'contracts' }
}

tasks.named('processTestResources') {
    // 커머스가 발급한 세션을 Gateway의 실제 검증 스크립트로 확인한다.
    from(rootProject.file('gateway/src/main/resources/redis/verify-session.lua')) { into 'gateway' }
}
