# 주문·결제·정산·환불 왕복을 켜는 덮어쓰기 설정. 기본 compose.yml 위에 얹어 씁니다.
#   docker compose -f compose.yml -f compose.financial-flow.yml up -d commerce payment-worker settlement
# 소비자를 켜기 전에 세 서비스가 자기 토픽을 만들고 각 소비 그룹의 offset을 준비해야 합니다(docs/development.md#주문결제정산환불-왕복).
# PG 승인과 외부 환불은 즉시 성공하는 stub입니다. 알림 소비·발송은 켜지 않습니다.
services:
  commerce:
    environment:
      APP_OUTBOX_ENABLED: 'true'
      APP_KAFKA_PAYMENT_ACCEPTED_ENABLED: 'true'
      APP_PAYMENT_ACCEPTED_PROCESSOR_ENABLED: 'true'
      APP_ORDER_RESULT_PROCESSOR_ENABLED: 'true'
  payment-worker:
    environment:
      APP_OUTBOX_ENABLED: 'true'
      APP_KAFKA_ORDER_PAYMENT_REQUESTED_ENABLED: 'true'
      APP_PAYMENT_REQUEST_PROCESSOR_ENABLED: 'true'
      APP_PAYMENT_APPROVAL_ENABLED: 'true'
      APP_REFUND_ENABLED: 'true'
      APP_KAFKA_SETTLEMENT_REPLIES_ENABLED: 'true'
  settlement:
    environment:
      APP_OUTBOX_ENABLED: 'true'
      APP_KAFKA_SETTLEMENT_EVENTS_ENABLED: 'true'
      SETTLEMENT_INBOX_PROCESSOR_ENABLED: 'true'
