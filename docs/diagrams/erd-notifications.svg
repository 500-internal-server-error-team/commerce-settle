<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" role="img" aria-labelledby="title desc"><title id="title">거래 알림 ERD</title><desc id="desc">네 테이블 모두 seller DB 소유. 원거래 항목의 유일성·발송 작업·시도·모의 수신을 구분한다. 물리 FK는 없다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" /></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" /></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" /></marker></defs><rect width="880" height="512" fill="#f5f5f5" /><path data-relation="delivery:items" d="M404 112 H464" fill="none" stroke="#4f5d75" stroke-width="1" /><text x="416" y="102" font-family="Geist Mono, SFMono-Regular, monospace" font-size="8" fill="#2d3142" font-weight="400">1</text><text x="438" y="102" font-family="Geist Mono, SFMono-Regular, monospace" font-size="8" fill="#2d3142" font-weight="400">1..N</text><path data-relation="delivery:attempts" d="M120 232 V328" fill="none" stroke="#4f5d75" stroke-width="1" /><text x="132" y="250" font-family="Geist Mono, SFMono-Regular, monospace" font-size="8" fill="#2d3142" font-weight="400">1</text><text x="132" y="314" font-family="Geist Mono, SFMono-Regular, monospace" font-size="8" fill="#2d3142" font-weight="400">0..N</text><path data-relation="delivery:receipt" d="M320 232 V288 Q320 296 328 296 H584 Q592 296 592 304 V328" fill="none" stroke="#4f5d75" stroke-width="1" /><text x="332" y="250" font-family="Geist Mono, SFMono-Regular, monospace" font-size="8" fill="#2d3142" font-weight="400">1</text><text x="604" y="314" font-family="Geist Mono, SFMono-Regular, monospace" font-size="8" fill="#2d3142" font-weight="400">0..1</text><g data-entity="notification_deliveries" data-box="16,32,388,200"><rect x="16" y="32" width="388" height="20