t-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="9" fill="#4f5d75" font-weight="400"># PK   → 논리 참조   ·   전체 컬럼·제약: 데이터 모델 문서   ·   실제 카카오 전달/읽음 이력이 아님</text></svg>
