<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="832" viewBox="0 0 1120 832" role="img" aria-labelledby="title desc" data-scope="service-execution">
  <title id="title">배치 실행과 영속 지급 작업의 경계</title>
  <desc id="desc">Commerce 내부 Scheduler가 월간 혜택 Job을 실행하여 대상 확정과 쿠폰 발급을 처리한다. Settlement 내부 Scheduler는 정산 일배치와 대조를 시작한다. 일배치가 만든 지급 작업은 별도 실행 풀의 Worker가 임대하고 금융 모의 서버에 호출한다. Kafka Consumer의 원장 반영은 배치와 독립적이다. 각 서비스는 자기 DB에 업무 상태와 Batch 메타데이터를 저장한다.</desc>
  <defs>
    <symbol id="logo-springbatch" viewBox="0 0 150.49 156.27">
      <path d="M0,101.29v11.57l75.24,43.41,75.25-43.41V101.29L75.24,144.7ZM0,78.14V89.71l75.24,43.41,75.25-43.41V78.14L75.24,121.55ZM75.24,0,0,43.41V66.56L75.24,110l75.25-43.41V43.41Z" fill="#6db33f" />
    </symbol>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 8 6">
      <path d="M0 0 8 3 0 6Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="1120" height="832" fill="#fff" />
  <text x="24" y="28" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="600" fill="#1e293b">배치 실행과 영속 작업의 경계</text>
  <g id="commerce-owner" data-zone="service-ownership" data-box="24,56,1072,232">
    <rect x="24" y="56" width="1072" height="232" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1" />
    <text x="40" y="84" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Commerce</text>
    <text x="40" y="104" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="10" font-weight="400" fill="#526176">Scheduler와 월간 Job은 commerce 앱 내부 · 업무·실행 이력은 commerce DB</text>
  </g>
  <g id="settlement-owner" data-zone="service-ownership" data-box="24,324,1072,320">
    <rect x="24" y="324" width="1072" height="320" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1" />
    <text x="40" y="352" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Settlement</text>
    <text x="40" y="372" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="10" font-weight="400" fill="#526176">Scheduler·Job·Consumer·지급 Worker는 settlement 앱 내부 · 실행 풀은 분리</text>
  </g>
