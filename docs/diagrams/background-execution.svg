  <path id="apply-ledger" data-edge="true" data-source="ledger-consumer" data-target="settlement-db" d="M712 548V496" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
