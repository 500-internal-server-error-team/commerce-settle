  <path id="commerce-store" data-edge="true" data-source="monthly-benefit-job" data-target="commerce-db" d="M712 164H824" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path id="settlement-trigger" data-edge="true" data-source="settlement-scheduler" data-target="settlement-jobs" d="M224 448H288" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path id="settlement-store" data-edge="true" data-source="settlement-jobs" data-target="settlement-db" d="M544 448H608" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
