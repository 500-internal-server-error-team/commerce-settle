<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="992" viewBox="0 0 1120 992" role="img" aria-labelledby="title desc" data-scope="service-execution">
  <title id="title">앱 내부 Job·Consumer·지급 Worker의 실행 경계</title>
  <desc id="desc">Commerce 월간 혜택 Job은 대상 확정·자동 검증과 쿠폰 발급의 두 Step이다. Settlement의 정산 일배치만 지급 작업을 생성한다. 정산 대조는 업무 데이터를 읽기만 하며 지급을 생성하지 않는다. Kafka 원장 Consumer와 영속 지급 작업을 임대하는 Worker는 Batch와 독립적이다. 경계는 서비스 소유권이며 PostgreSQL 한 컨테이너 안에서 네 업무 DB를 분리한다. 현재 목표는 기존 여섯 앱을 사용한다.</desc>
