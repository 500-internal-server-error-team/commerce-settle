<svg xmlns="http://www.w3.org/2000/svg" width="880" height="202" viewBox="0 0 880 202" role="img" aria-labelledby="title desc"><title id="title">메시지·멱등성 ERD</title><desc id="desc">주요 필드와 논리 관계. 전체 컬럼과 제약은 데이터 모델 문서가 기준이며 물리 FK는 없다.</desc><rect width="880" height="202" fill="#fff"/><path data-relation="outbox:inbox" d="M264,86 L312,86" fill="none" stroke="#94a3b8" stroke-width="1"/><g data-entity="outbox" data-box="16,16,248,142"><rect x="16" y="16" width="248" height="142" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/><path d="M16 60h248" stroke="#e2e8f0"/><text x="28" y="36" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="600" fill="#263244">발행할 이벤트</text><text x="28" y="51" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#64748b">outbox</text><text x="28" y="77" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569"># id uuid</text><text x="28" y="91" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">event_type varchar(80)</text><text x="28" y="105" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">event_version integer</text><text x="28" y="119" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">aggregate_id uuid</text><text x="28" y="133" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">aggregate_version bigint</text><text x="28" y="147" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">topic varchar(100)</text></g><g data-entity="inbox" data-box="312,16,248,142"><rect x="312" y="16" width="248" height="142" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/><path d="M312 60h248" stroke="#e2e8f0"/><text x="324" y="36" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="600" fill="#263244">수신 이벤트</text><text x="324" y="51" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#64748b">inbox</text><text x="324" y="77" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569"># id uuid</text><text x="324" y="91" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">consumer varchar(100)</text><text x="324" y="105" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">event_id uuid</text><text x="324" y="119" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">aggregate_id uuid</text><text x="324" y="133" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">aggregate_version bigint</text><text x="324" y="147" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">status varchar(24)</text></g><g data-entity="idempotency_records" data-box="608,16,248,142"><rect x="608" y="16" width="248" height="142" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/><path d="M608 60h248" stroke="#e2e8f0"/><text x="620" y="36" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="600" fill="#263244">요청 멱등 기록</text><text x="620" y="51" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#64748b">idempotency_records</text><text x="620" y="77" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569"># id uuid</text><text x="620" y="91" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">actor_kind varchar(24)</text><text x="620" y="105" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">actor_id varchar(100)</text><text x="620" y="119" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">operation varchar(100)</text><text x="620" y="133" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">key_hash char(64)</text><text x="620" y="147" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">request_hash char(64)</text></g><text x="274" y="78" font-family="Geist Mono, SFMono-Regular, monospace" font-size="8" font-weight="400" fill="#64748b">1</text><text x="286" y="78" font-family="Geist Mono, SFMono-Regular, monospace" font-size="8" font-weight="400" fill="#64748b">0..N</text><text x="16" y="190" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#64748b"># PK   → 논리 참조   관계선은 DB FK가 아님</text></svg>
