<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="title desc">
  <title id="title">메시지·멱등성·감사 ERD</title>
  <desc id="desc">주요 필드와 논리 관계, 단일·복합 유일제약과 적용 조건. 전체 컬럼과 제약은 데이터 모델 문서가 기준이며 물리 FK는 없다. Outbox·Inbox·멱등 기록·감사는 각 소유 서비스 DB에 개별 저장하는 공통 구조다. Outbox의 status는 발행 상태, published_at은 Kafka 브로커 ACK 확인 뒤 확정한 시각이다.</desc>
  <rect width="1200" height="612" fill="#ffffff" />
  <path data-relation="outbox:inbox" d="M360,132 L432,132" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
