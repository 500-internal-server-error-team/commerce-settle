    <path d="M24,80h336" stroke="#e2e8f0" />
    <text x="40.0" y="100" fill="#334155" font-family="Geist Mono, SFMono-Regular, monospace" font-size="10.5" font-weight="400" data-role="field"># id uuid (= eventId)</text>
    <text x="40.0" y="118" fill="#334155" font-family="Geist Mono, SFMono-Regular, monospace" font-size="10.5" font-weight="400" data-role="field">
      <tspan x="40.0">event_type</tspan>
