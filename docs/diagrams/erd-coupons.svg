<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-labelledby="title desc"><title id="title">쿠폰 ERD</title><desc id="desc">주요 필드와 논리 관계. 전체 컬럼과 제약은 데이터 모델 문서가 기준이며 물리 FK는 없다.</desc><rect width="880" height="216" fill="#fff"/><path data-relation="coupon_templates:buyer_coupons" d="M264,86 L312,86" fill="none" stroke="#94a3b8" stroke-width="1"/><path data-relation="buyer_coupons:coupon_history" d="M560,86 L608,86" fill="none" stroke="#94a3b8" stroke-width="1"/><g data-entity="coupon_templates" data-box="16,16,248,142"><rect x="16" y="16" width="248" height="142" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/><path d="M16 60h248" stroke="#e2e8f0"/><text x="28" y="36" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="600" fill="#263244">쿠폰 템플릿</text><text x="28" y="51" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#64748b">coupon_templates</text><text x="28" y="77" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569"># id uuid</text><text x="28" y="91" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">→ seller_id uuid</text><text x="28" y="105" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">discount_amount bigint</text><text x="28" y="119" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">issuance_limit integer</text><text x="28" y="133" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">valid_from timestamptz</text><text x="28" y="147" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">valid_until timestamptz</text></g><g data-entity="buyer_coupons" data-box="312,16,248,156"><rect x="312" y="16" width="248" height="156" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/><path d="M312 60h248" stroke="#e2e8f0"/><text x="324" y="36" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="600" fill="#263244">발급 쿠폰</text><text x="324" y="51" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#64748b">buyer_coupons</text><text x="324" y="77" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569"># id uuid</text><text x="324" y="91" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">→ template_id uuid</text><text x="324" y="105" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">→ buyer_id uuid</text><text x="324" y="119" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">expires_at timestamptz</text><text x="324" y="133" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">status varchar(16)</text><text x="324" y="147" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">→ reserved_order_id uuid?</text><text x="324" y="161" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569">→ used_order_id uuid?</text></g><g data-entity="coupon_history" data-box="608,16,248,142"><rect x="608" y="16" width="248" height="142" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/><path d="M608 60h248" stroke="#e2e8f0"/><text x="620" y="36" font-family="Geist, Arial, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="600" fill="#263244">쿠폰 예약·복구 이력</text><text x="620" y="51" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#64748b">coupon_history</text><text x="620" y="77" font-family="Geist Mono, SFMono-Regular, monospace" font-size="9" font-weight="400" fill="#475569"># id uuid</