name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.repository) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  demo-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demo-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Test Swagger session client
        run: node --test ../gateway/src/test/js/swagger-session.test.cjs
      - run: npm run build

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - &gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify Python helpers
        run: |
          python3 scripts/test_init_env.py
          python3 -B scripts/test_compose.py
          python3 -B scripts/test_render_ecs_data.py
          python3 -B scripts/smoke_caddy.py
          python3 scripts/test_sync_redis_run_id.py
          python3 scripts/test_pr_body.py
          python3 -B -m unittest discover -s scripts -p 'test_storage_metrics.py'
          python3 -B scripts/test_runtime_metrics.py
          python3 -B scripts/test_ecs_observability.py
          python3 -B -m unittest discover -s scripts -p 'test_admission_runner.py'
          python3 -B scripts/test_prepare_financial_kafka.py
          python3 -B -m unittest discover -s scripts -p 'test_ci_helpers.py'
          python3 -B scripts/test_kakao_login.py
          python3 -B -m unittest discover -s tests/load -p 'test_payment_load.py'
          python3 -B -m unittest discover -s tests/load -p 'test_order_load.py'
          python3 -B -m unittest discover -s tests/load -p 'test_performance.py'
          python3 -B -m unittest discover -s tests/load -p 'test_resource_sample.py'
      - name: Check Java formatting and Checkstyle (main and test)
        run: ./gradlew --no-daemon --parallel --continue spotlessCheck checkstyleMain checkstyleTest
      - name: Upload style reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-style
          path: '**/build/reports/checkstyle/'
          if-no-files-found: ignore
          retention-days: 7

  deployment-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - name: Verify deployment, rollback and image cleanup
        run: python3 -B scripts/test_ecs_apps.py

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *java
      - *gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build local demo UI for the control jar
        working-directory: demo-ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: Package applications
        run: ./gradlew --no-daemon --parallel bootJar
      - name: Share application jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-jars
          path: '*/build/libs/app.jar'
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: commerce
            tasks: ':commerce:test'
          - group: settlement
            tasks: ':settlement:test'
          - group: other-services
            tasks: ':payment:test :finance-mock:test :gateway:test :internal-auth:test :observability:test :worker-runtime:test :demo-control:test'
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Run tests and architecture checks
        run: ./gradlew --no-daemon --parallel --continue ${{ matrix.tasks }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-tests-${{ matrix.group }}
          path: |
            **/build/reports/tests/
            **/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

  zipkin-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Verify native Zipkin persistence, retention and disk-pressure recovery
        run: python3 -B scripts/test_zipkin_storage.py

  observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - name: Verify financial and runtime alert delivery
        run: python3 scripts/test_observability.py

  integration:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ startsWith(matrix.scenario, 'financial-') && 35 || (matrix.scenario == 'reconciliation' || matrix.scenario == 'demo-runs') && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [smoke, redis, retention, admission, financial-core, financial-refund-failures, reconciliation, demo-ui, demo-runs]
    env:
      COMPOSE_PROJECT_NAME: ${{ matrix.scenario == 'demo-ui' && 'commerce-settle-ui-ci' || 'commerce-settle-ci' }}
      COMPOSE_FILE: ${{ matrix.scenario == 'demo-ui' && 'compose.yml:compose.demo-ui.yml' || 'compose.yml' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - *checkout
      - name: Download application jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-jars
      - name: Initialize local settings
        run: python3 scripts/init_env.py
      - name: Configure isolated demo UI operator credentials
        if: matrix.scenario == 'demo-ui'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          with Path('.env').open('a') as settings:
              for service in ['COMMERCE', 'PAYMENT', 'SETTLEMENT', 'FINANCE_MOCK']:
                  credential = secrets.token_urlsafe(32)
                  print('::add-mask::' + credential)
                  settings.write(f'DEMO_{service}_OPERATOR_CREDENTIAL={credential}\n')
          PY
      - name: Verify actual financial observations and order admission recovery
        if: matrix.scenario == 'admission'
        run: python3 scripts/test_admission.py
      - name: Verify the order, payment, settlement and refund round trip
        if: startsWith(matrix.scenario, 'financial-')
        env:
          FINANCIAL_GROUP: ${{ matrix.scenario }}
        run: python3 -B scripts/smoke_financial_flow.py --group "${FINANCIAL_GROUP#financial-}"
      - name: Verify real-clock demo runs and mock payout
        if: matrix.scenario == 'demo-runs'
        run: python3 -B scripts/smoke_demo_runs.py
      - name: Verify fixed reconciliation delivery wait, outage and restart
        if: matrix.scenario == 'reconciliation'
        run: python3 -B scripts/test_reconciliation.py
      - name: Start the stack from empty volumes
        if: matrix.scenario != 'admission' && !startsWith(matrix.scenario, 'financial-') && matrix.scenario != 'reconciliation' && matrix.scenario != 'demo-ui' && matrix.scenario != 'demo-runs'
        run: |
          python3 scripts/sync_redis_run_id.py
          docker compose up -d --build --wait --wait-timeout 300
      - name: Verify demo UI operator ports on startup and restart
        if: matrix.scenario == 'demo-ui'
        run: |
          python3 scripts/sync_redis_run_id.py
          docker compose up -d --build --wait --wait-timeout 300
          python3 -B scripts/smoke.py --demo-ui
          docker compose restart commerce payment-api settlement finance-mock
          docker compose up -d --wait --wait-timeout 300 --no-recreate
          docker compose restart gateway payment-worker
          docker compose up -d --wait --wait-timeout 300 --no-recreate
          python3 -B scripts/smoke.py --demo-ui
      - name: Verify service, database and messaging boundaries
        if: matrix.scenario == 'smoke'
        run: python3 scripts/smoke.py
      - name: Verify source-backed notification retention
        if: matrix.scenario == 'retention'
        run: python3 -B scripts/smoke_retention.py
      - name: Verify auth stays blocked after a Redis restart until re-approval
        if: matrix.scenario == 'redis'
        run: python3 scripts/smoke_redis_restart.py
      - name: Verify the load tool at a small arrival rate
        if: matrix.scenario == 'smoke'
        run: docker compose --profile tools run --rm --no-deps -e RATE=2 -e DURATION_SECONDS=3 k6
      - name: Verify restart with retained data
        if: matrix.scenario == 'smoke'
        run: python3 -B scripts/smoke_restart.py
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=80
      - name: Clean up CI containers and test volumes
        if: always()
        run: docker compose --profile observability --profile tools down -v --remove-orphans

  publish:
    needs: build-and-smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        module: [gateway, commerce, payment, settlement, finance-mock]
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - *checkout
      - name: Download application jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-jars
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        name: Build and push the linux/arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: MODULE=${{ matrix.module }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.module }}-${{ github.ref_name }}
          provenance: false
          push: true
      - name: Record the image digest
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.module }}-${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MODULE: ${{ matrix.module }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          image = os.environ["IMAGE"].rsplit(":", 1)[0] + "@" + os.environ["DIGEST"]
          record = {"module": os.environ["MODULE"], "image": image,
                    "release": os.environ["GITHUB_REF_NAME"], "commit": os.environ["GITHUB_SHA"]}
          Path("work").mkdir(exist_ok=True)
          Path("work/" + record["module"] + ".json").write_text(json.dumps(record))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              print("- " + os.environ["IMAGE"] + " → " + image, file=summary)
          PY
      - name: Share the release image reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.module }}
          path: work/${{ matrix.module }}.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ECS_DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ecs-app-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      DEMO_AUTO_SHIPMENT: ${{ vars.APP_DEMO_AUTO_SHIPMENT_ENABLED || 'preserve' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the current main release commit
        run: |
          if [ "$GITHUB_SHA" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo "Tag deployment requires the current main commit; create a new release tag." >&2
            exit 1
          fi
      - name: Download the five release images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-image-*
          merge-multiple: true
          path: work/images
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: baseline
        name: Capture rollback baseline without changing AWS
        run: |
          python3 -B scripts/deploy_ecs_apps.py \
            --cluster "$ECS_CLUSTER" --region "$AWS_REGION" \
            --images-directory work/images --release "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --public-url "$PUBLIC_BASE_URL" --record work/rollback-plan.json --prepare-only \
            --demo-auto-shipment "$DEMO_AUTO_SHIPMENT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from pathlib import Path
          print("sha256=" + hashlib.sha256(Path("work/rollback-plan.json").read_bytes()).hexdigest())
          PY
      - name: Preserve rollback baseline before the first AWS change
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecs-rollback-${{ github.ref_name }}-${{ github.run_attempt }}
          path: work/rollback-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Deploy app revisions and verify public HTTPS
        env:
          BASELINE_SHA256: ${{ steps.baseline.outputs.sha256 }}
        run: |
          python3 -B scripts/deploy_ecs_apps.py \
            --cluster "$ECS_CLUSTER" --region "$AWS_REGION" \
            --images-directory work/images --release "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --public-url "$PUBLIC_BASE_URL" --record work/deployment.json \
            --baseline work/rollback-plan.json --baseline-sha256 "$BASELINE_SHA256" \
            --demo-auto-shipment "$DEMO_AUTO_SHIPMENT"
      - name: Keep deployment and rollback references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecs-deployment-${{ github.ref_name }}-${{ github.run_attempt }}
          path: work/deployment.json
          if-no-files-found: ignore
          retention-days: 7

  build-and-smoke:
    if: always()
    needs: [checks, deployment-checks, package, tests, observability, zipkin-storage, integration, demo-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              print('Required checks did not succeed:', failed or 'no results')
              sys.exit(1)
          PY
