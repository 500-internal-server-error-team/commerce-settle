name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - &gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify Python helpers
        run: |
          python3 scripts/test_init_env.py
          python3 -B scripts/test_compose.py
          python3 scripts/test_sync_redis_run_id.py
          python3 scripts/test_pr_body.py
          python3 -B -m unittest discover -s scripts -p 'test_storage_metrics.py'
          python3 -B -m unittest discover -s scripts -p 'test_admission_runner.py'
          python3 -B -m unittest discover -s scripts -p 'test_ci_helpers.py'
          python3 -B scripts/test_kakao_login.py
          python3 -B -m unittest discover -s tests/load -p 'test_payment_load.py'
      - name: Check Java formatting and Checkstyle (main and test)
        run: ./gradlew --no-daemon --parallel --continue spotlessCheck checkstyleMain checkstyleTest
      - name: Upload style reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-style
          path: '**/build/reports/checkstyle/'
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Package applications
        run: ./gradlew --no-daemon --parallel bootJar
      - name: Share application jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-jars
          path: '*/build/libs/app.jar'
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: commerce
            tasks: ':commerce:test'
          - group: settlement
            tasks: ':settlement:test'
          - group: other-services
            tasks: ':payment:test :finance-mock:test :gateway:test :internal-auth:test'
    steps:
      - *checkout
      - *java
      - *gradle
      - name: Run tests and architecture checks
        run: ./gradlew --no-daemon --parallel --continue ${{ matrix.tasks }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-tests-${{ matrix.group }}
          path: |
            **/build/reports/tests/
            **/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

  observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - name: Verify quarantine and notification alert delivery
        run: python3 scripts/test_observability.py

  integration:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (matrix.scenario == 'financial-flow' || matrix.scenario == 'reconciliation') && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [smoke, redis, retention, admission, financial-flow, reconciliation]
    env:
      COMPOSE_PROJECT_NAME: commerce-settle-ci
      PYTHONUNBUFFERED: '1'
    steps:
      - *checkout
      - name: Download application jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-jars
      - name: Initialize local settings
        run: python3 scripts/init_env.py
      - name: Verify actual financial observations and order admission recovery
        if: matrix.scenario == 'admission'
        run: python3 scripts/test_admission.py
      - name: Verify the order, payment, settlement and refund round trip
        if: matrix.scenario == 'financial-flow'
        run: python3 -B scripts/smoke_financial_flow.py
      - name: Verify fixed reconciliation delivery wait, outage and restart
        if: matrix.scenario == 'reconciliation'
        run: python3 -B scripts/test_reconciliation.py
      - name: Start the stack from empty volumes
        if: matrix.scenario != 'admission' && matrix.scenario != 'financial-flow' && matrix.scenario != 'reconciliation'
        run: |
          python3 scripts/sync_redis_run_id.py
          docker compose up -d --build --wait --wait-timeout 300
      - name: Verify service, database and messaging boundaries
        if: matrix.scenario == 'smoke'
        run: python3 scripts/smoke.py
      - name: Verify source-backed notification retention
        if: matrix.scenario == 'retention'
        run: python3 -B scripts/smoke_retention.py
      - name: Verify auth stays blocked after a Redis restart until re-approval
        if: matrix.scenario == 'redis'
        run: python3 scripts/smoke_redis_restart.py
      - name: Verify the load tool at a small arrival rate
        if: matrix.scenario == 'smoke'
        run: docker compose --profile tools run --rm --no-deps -e RATE=2 -e DURATION_SECONDS=3 k6
      - name: Verify restart with retained data
        if: matrix.scenario == 'smoke'
        run: python3 -B scripts/smoke_restart.py
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=80
      - name: Clean up CI containers and test volumes
        if: always()
        run: docker compose --profile observability --profile tools down -v --remove-orphans

  build-and-smoke:
    if: always()
    needs: [checks, package, tests, observability, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              print('Required checks did not succeed:', failed or 'no results')
              sys.exit(1)
          PY
