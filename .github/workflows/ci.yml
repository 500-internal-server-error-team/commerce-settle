name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: commerce-settle-ci
      COMPOSE_FILE: compose.yml:.github/compose.ci.yml
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify local settings generator
        run: python3 scripts/test_init_env.py
      - name: Check Java formatting and Checkstyle (main and test)
        run: ./gradlew --daemon --parallel --continue spotlessCheck checkstyleMain checkstyleTest
      - name: Run tests, architecture checks and package all applications
        run: ./gradlew --daemon --parallel --continue build
      - name: Stop Gradle daemons before starting the stack
        if: always()
        run: ./gradlew --stop
      - name: Initialize local settings
        run: python3 scripts/init_env.py
      - name: Start the stack from empty volumes
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify service, database and messaging boundaries
        run: python3 scripts/smoke.py
      - name: Verify the load tool at a small arrival rate
        run: docker compose --profile tools run --rm --no-deps -e RATE=2 -e DURATION_SECONDS=3 k6
      - name: Verify restart with retained data
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 300
          python3 scripts/smoke.py
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/reports/checkstyle/
            **/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=80
      - name: Clean up CI containers and test volumes
        if: always()
        run: docker compose --profile observability --profile tools down -v --remove-orphans
